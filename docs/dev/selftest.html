<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>selftest — 순수 로직 검증</title>
<style>
  body{font:14px/1.6 ui-monospace,Consolas,monospace;padding:20px;max-width:900px;margin:0 auto}
  h1{font-size:18px}
  .pass{color:#2f855a}.fail{color:#c53030;font-weight:700}
  li{margin:2px 0;white-space:pre-wrap}
  #summary{font-size:16px;font-weight:700;margin:12px 0}
</style>
</head>
<body>
<h1>selftest</h1>
<p>키가 필요 없는 순수 로직(마크다운 변환, 이스케이프, 경로/URL 생성)만 검증합니다.
API 호출은 여기서 확인할 수 없습니다.</p>
<div id="summary">실행 중…</div>
<ul id="out"></ul>

<script type="module">
import { mdToHtml, splitTitle, esc, escAttr } from "../js/markdown.js";
import { TEXT_MODELS, TEXT_MODEL_DEFAULT, TOPIC_TONES, THUMB_STYLES, BLANKS, BUTTON_PLACEHOLDER, isPlanQuota, retryDelayMs, buildPrompt } from "../js/gemini.js";
import * as buttons from "../js/buttons.js";
import * as checks from "../js/checks.js";
import { markBlanks, unmarkBlanks } from "../js/editor.js";
import * as history from "../js/history.js";

const out = document.getElementById("out");
let pass = 0, fail = 0;

function check(name, actual, expected) {
  const ok = actual === expected;
  ok ? pass++ : fail++;
  const li = document.createElement("li");
  li.className = ok ? "pass" : "fail";
  li.textContent = (ok ? "PASS  " : "FAIL  ") + name +
    (ok ? "" : `\n      기대: ${expected}\n      실제: ${actual}`);
  out.appendChild(li);
}

function contains(name, haystack, needle) {
  check(name, haystack.includes(needle) ? "포함" : `미포함 → ${haystack}`, "포함");
}
// ── 마크다운 → HTML ──
check("## 는 h3 로", mdToHtml("## 소제목"), "<h3>소제목</h3>");
check("### 는 h4 로", mdToHtml("### 소소제목"), "<h4>소소제목</h4>");
check("# 는 h2 로(제목은 h1 이므로)", mdToHtml("# 큰제목"), "<h2>큰제목</h2>");
check("문단", mdToHtml("그냥 한 줄"), "<p>그냥 한 줄</p>");
check("굵게", mdToHtml("**굵게**"), "<p><b>굵게</b></p>");
check("기울임", mdToHtml("*기울임*"), "<p><i>기울임</i></p>");
check("인라인 코드", mdToHtml("`code`"), "<p><code>code</code></p>");
check("구분선", mdToHtml("---"), "<hr />");
check("순서없는 목록", mdToHtml("- 하나\n- 둘"), "<ul>\n<li>하나</li>\n<li>둘</li>\n</ul>");
check("순서있는 목록", mdToHtml("1. 하나\n2. 둘"), "<ol>\n<li>하나</li>\n<li>둘</li>\n</ol>");
check("코드펜스", mdToHtml("```\na < b\n```"), "<pre><code>a &lt; b</code></pre>");
check("HTML 특수문자 이스케이프", mdToHtml("a < b & c"), "<p>a &lt; b &amp; c</p>");

// 링크: URL 의 & 가 이중 이스케이프되면 안 된다(&amp;amp; 금지)
const link = mdToHtml("[보기](https://e.com/?a=1&b=2)");
contains("링크 href 유지", link, 'href="https://e.com/?a=1&amp;b=2"');
check("링크 이중 이스케이프 없음", link.includes("&amp;amp;"), false);

// 링크 URL 에 따옴표가 들어가도 속성이 깨지지 않아야 한다
contains("링크 URL 안의 따옴표 차단", mdToHtml('[x](https://e.com/")'), "&quot;");

// ── 제목 분리 ──
const s1 = splitTitle("# 계란찜 만들기\n\n본문입니다.");
check("첫 줄 제목 분리", s1.title, "계란찜 만들기");
check("제목 제외한 본문", s1.body, "본문입니다.");
const s2 = splitTitle("제목 없는 글");
check("제목이 없으면 빈 문자열", s2.title, "");
check("제목이 없으면 본문 그대로", s2.body, "제목 없는 글");

// ── 이스케이프 ──
check("esc 는 따옴표를 두지 않는다", esc('a"b'), 'a"b');
check("escAttr 은 따옴표를 막는다", escAttr('a"b'), "a&quot;b");
check("escAttr 은 홑따옴표도 막는다", escAttr("a'b"), "a&#39;b");
check("escAttr 은 꺾쇠도 막는다", escAttr("<img>"), "&lt;img&gt;");


// ── 모델 / 프롬프트 ──
check("기본 모델이 목록에 있다", TEXT_MODELS.some((m) => m.id === TEXT_MODEL_DEFAULT), true);
check("모델 항목은 id/label 을 갖는다", TEXT_MODELS.every((m) => !!m.id && !!m.label), true);
check("주제 분야는 4종", TOPIC_TONES.length, 4);

check("썸네일 그림풍 3종", THUMB_STYLES.map((s) => s.id).join(","), "실사,그림,애니메이션");

// 빈칸 모드에서는 빈칸 지시가 반드시 들어가야 한다.
const PB = buildPrompt({ keyword: "초기창업패키지", topic: "창업·정보", lang: "한국어", mode: "blanks" });
for (const b of BLANKS) contains(`빈칸 모드에 ${b} 지시`, PB.system, b);
contains("빈칸 모드는 완성을 막는다", PB.system, "완성하지 마세요");

// 완성본 모드에서는 채우라는 표시를 남기면 안 된다.
const PC = buildPrompt({ keyword: "초기창업패키지", topic: "창업·정보", lang: "한국어", mode: "complete" });
contains("완성본 모드는 완성을 시킨다", PC.system, "완성된 글");
contains("완성본 모드는 대괄호를 막는다", PC.system, "대괄호");
check("완성본 모드에는 빈칸 지시가 없다", PC.system.includes("[내 경험]"), false);
contains("기본은 완성본", buildPrompt({ keyword: "k", topic: "생활", lang: "한국어" }).system, "완성된 글");

// 두 모드 모두 공통 규칙은 유지된다.
for (const P of [PB, PC]) {
  contains("버튼 자리 지시", P.system, BUTTON_PLACEHOLDER);
  contains("지어내기 금지", P.system, "지어내지 마세요");
  contains("1,000자 기준", P.system, "1,000자");
}
contains("주제 분야별 말투 반영", PC.system, "실용");

// ── 확인 항목이 "무엇이" 남았는지까지 알려준다 ──
const bd = checks.blankDetail("<p>[내 경험] [내 경험] [최신 확인] [버튼: 텍스트 | URL]</p>");
check("남은 개수 합계", bd.total, 4);
contains("어떤 빈칸인지 이름을 준다", bd.labels.join(" "), "[내 경험] 2개");
contains("버튼 자리도 알려준다", bd.labels.join(" "), "버튼 자리 1개");
check("다 채우면 빈 목록", checks.blankDetail("<p>다 썼다</p>").labels.length, 0);
const helpful = checks.runChecks("<p>[내 경험]</p>").list.find((c) => c.key === "blanks");
check("걸린 항목에는 안내가 붙는다", helpful.help.length > 0, true);
contains("남은 것을 이름으로 보여준다", helpful.detail, "[내 경험]");

// ── 429 구분: 기다리면 풀리는 분당 한도 vs 진짜 요금제 한도 ──
// 둘 다 "check your plan and billing" 이라 문구로는 구분이 안 된다. RetryInfo 로 가른다.
// (문구로만 판단했다가 분당 한도를 영구 차단으로 오진한 적이 있다.)
const minuteLimit = JSON.stringify({ error: {
  message: "You exceeded your current quota, please check your plan and billing details.",
  details: [{ "@type": "type.googleapis.com/google.rpc.RetryInfo", retryDelay: "53s" }] } });
const planLimit = JSON.stringify({ error: {
  message: "You exceeded your current quota, please check your plan and billing details." } });

check("분당 한도는 대기 시간을 읽는다", retryDelayMs(minuteLimit), 53000);
check("분당 한도는 요금제 문제가 아니다", isPlanQuota(minuteLimit), false);
check("RetryInfo 없으면 요금제 한도", isPlanQuota(planLimit), true);
check("소수점 대기도 읽는다",
  retryDelayMs(JSON.stringify({ error: { details: [{ "@type": "RetryInfo", retryDelay: "1.5s" }] } })), 1500);
check("비JSON 은 0", retryDelayMs("not json"), 0);
check("RetryInfo 가 없으면 0", retryDelayMs(planLimit), 0);
check("초당 제한형 429 는 요금제 문제가 아니다",
  isPlanQuota("Resource has been exhausted (e.g. check quota)."), false);
check("null 본문도 안전하다", isPlanQuota(null), false);

// ── 버튼 HTML (CLAUDE.md 5장 사양) ──
const B = buttons.buttonHtml({ text: "꿀팁 보기", url: "https://ex.com/a?x=1&y=2" });
contains("sponsored 표기", B, 'rel="nofollow sponsored noopener"');
contains("새 탭", B, 'target="_blank"');
contains("인라인 배경색", B, "background:#2563eb");
contains("둥근 모서리", B, "border-radius:10px");
contains("가운데 정렬", B, "text-align:center");
contains("URL 유지", B, "https://ex.com/a?x=1&amp;y=2");
check("class 를 쓰지 않는다(티스토리에서 유실됨)", B.includes("class="), false);
contains("버튼 텍스트", B, "꿀팁 보기");
// 텍스트에 태그를 넣어도 깨지면 안 된다
check("버튼 텍스트 이스케이프", buttons.buttonHtml({ text: "<b>x</b>", url: "u" }).includes("<b>x</b>"), false);

// ── 버튼 플레이스홀더 ──
const body1 = "앞\n[버튼: 텍스트 | URL]\n중간\n[버튼: 신청하기 | https://a.com]\n끝";
const found = buttons.findPlaceholders(body1);
check("플레이스홀더 2개를 찾는다", found.length, 2);
check("안내어 '텍스트'는 값으로 보지 않는다", found[0].text, "");
check("안내어 'URL'도 값으로 보지 않는다", found[0].url, "");
check("채워진 텍스트는 읽는다", found[1].text, "신청하기");
check("채워진 URL 도 읽는다", found[1].url, "https://a.com");
const replaced = buttons.replaceAt(body1, found[1].index, found[1].raw, "<BTN>");
contains("해당 자리만 바뀐다", replaced, "<BTN>");
check("다른 자리는 그대로", replaced.includes("[버튼: 텍스트 | URL]"), true);
check("플레이스홀더 유무", buttons.hasPlaceholder("없음"), false);

// ── 버튼 자리가 없으면 코드로 보장 ──
const noSlots = "<h3>A</h3><p>a</p><h3>B</h3><p>b</p><h3>C</h3><p>c</p><h3>D</h3><p>d</p>";
const ensured = buttons.ensureButtonSlots(noSlots);
check("자리가 없으면 2개를 넣는다", buttons.findPlaceholders(ensured).length, 2);
check("첫 소제목 앞에는 넣지 않는다", ensured.indexOf("[버튼") > ensured.indexOf("<h3>A</h3>"), true);
check("이미 있으면 건드리지 않는다",
  buttons.ensureButtonSlots("<p>[버튼: 텍스트 | URL]</p>"), "<p>[버튼: 텍스트 | URL]</p>");
check("소제목이 적어도 2개를 채운다",
  buttons.findPlaceholders(buttons.ensureButtonSlots("<p>글만 있음</p>")).length, 2);

// ── 제휴 고지 ──
check("고지 없음을 안다", buttons.hasNotice("<p>본문</p>"), false);
const withNotice = buttons.appendNotice("<p>본문</p>");
check("고지를 붙인다", buttons.hasNotice(withNotice), true);
check("두 번 붙이지 않는다", buttons.appendNotice(withNotice), withNotice);

// ── 버튼 개수 세기 ──
check("버튼 0개", buttons.countButtons("<p>x</p>").total, 0);
check("버튼 2개", buttons.countButtons(B + B).total, 2);
check("URL 빈 버튼을 센다", buttons.countButtons(buttons.buttonHtml({ text: "t", url: "" })).missingUrl, 1);

// ── 완성도 체크 ──
check("빈칸을 센다", checks.countBlanks("<p>[내 경험] 과 [실제 수치]</p>"), 2);
check("소제목을 센다", checks.countHeadings("<h3>a</h3><h4>b</h4><h2>c</h2>"), 3);
check("글자 수에서 태그를 뺀다", checks.bodyTextLength("<p>가나다</p>"), 3);
check("글자 수에서 빈칸을 뺀다", checks.bodyTextLength("<p>가나다[내 경험]</p>"), 3);
check("글자 수에서 버튼 자리를 뺀다", checks.bodyTextLength("<p>가나다[버튼: 텍스트 | URL]</p>"), 3);
check("공백은 글자 수에서 제외", checks.bodyTextLength("<p>가 나\n다</p>"), 3);

const short = checks.runChecks("<p>짧다</p>");
check("짧으면 통과 못 한다", short.allOk, false);
check("버튼 없으면 고지는 해당 없음", short.list.find(c => c.key === "notice").ok, true);
const withBlank = checks.runChecks("<p>[내 경험]</p>");
check("빈칸이 남으면 걸린다", withBlank.list.find(c => c.key === "blanks").ok, false);
const btnNoUrl = checks.runChecks(buttons.buttonHtml({ text: "t", url: "" }) + B);
check("URL 빈 버튼이 있으면 걸린다", btnNoUrl.list.find(c => c.key === "buttons").ok, false);

// ── 빈칸 칠하기(화면 표시용) ──
check("빈칸을 칠한다", markBlanks("<p>[내 경험]</p>").includes(String.fromCharCode(60)+"mark class=\"blank\""), true);
check("버튼 자리는 다른 색으로", markBlanks("<p>[버튼: 텍스트 | URL]</p>").includes("blank slot"), true);
check("칠을 벗기면 원래대로", unmarkBlanks(markBlanks("<p>[내 경험]</p>")), "<p>[내 경험]</p>");
check("두 번 칠해도 한 겹", (markBlanks(markBlanks("<p>[내 경험]</p>")).match(/mark class/g)||[]).length, 1);
check("칠한 뒤에도 빈칸 개수는 그대로", checks.countBlanks(markBlanks("<p>[내 경험] [내 의견]</p>")), 2);
check("일반 글자는 안 건드린다", markBlanks("<p>그냥 글</p>"), "<p>그냥 글</p>");

// ── 지난 글 보관함 ──
// 저장소를 인자로 받게 만들어 둔 덕분에 localStorage 를 건드리지 않고 검사할 수 있다.
function fakeStore(initial) {
  const m = new Map(initial ? [[history.HISTORY_KEY, initial]] : []);
  return {
    getItem: (k) => (m.has(k) ? m.get(k) : null),
    setItem: (k, v) => m.set(k, v),
    removeItem: (k) => m.delete(k),
    _dump: () => m.get(history.HISTORY_KEY),
  };
}

check("태그를 벗겨 글자만", history.plainText("<p>가나다</p>"), "가나다");
check("문단 사이는 띄운다", history.plainText("<p>가</p><p>나</p>"), "가 나");
check("br 도 띄운다", history.plainText("가<br>나"), "가 나");
check("실체 참조를 되돌린다", history.plainText("<p>a&amp;b</p>"), "a&b");
check("제목이 있으면 제목을 쓴다", history.makeLabel("내 제목", "본문"), "내 제목");
check("제목이 없으면 본문 앞을", history.makeLabel("", "본문 첫 줄"), "본문 첫 줄");
check("둘 다 없으면 제목 없음", history.makeLabel("", ""), "(제목 없음)");
check("긴 제목 대체는 자른다", history.makeLabel("", "가".repeat(60)).length, 41);
check("짧은 미리보기는 그대로", history.makeSnippet("짧다"), "짧다");
check("긴 미리보기는 자른다", history.makeSnippet("가".repeat(200)).length, 91);

const e1 = history.makeEntry({ title: "글 하나", body: "<p>가나다</p>" });
check("항목에 id 가 붙는다", typeof e1.id, "string");
check("항목이 글자 수를 센다", e1.chars, 3);
check("항목에 이름이 붙는다", e1.label, "글 하나");
check("id 를 주면 그대로 쓴다", history.makeEntry({ id: "keep", title: "t" }).id, "keep");

const listA = history.upsert([], e1);
check("넣으면 하나", listA.length, 1);
const e1b = history.makeEntry({ id: e1.id, title: "고친 제목", body: "<p>가나다라</p>" });
const listB = history.upsert(listA, e1b);
check("같은 id 는 새로 쌓지 않는다", listB.length, 1);
check("같은 id 는 내용이 갱신된다", listB[0].label, "고친 제목");
const listC = history.upsert(listB, history.makeEntry({ title: "다른 글" }));
check("다른 글은 따로 쌓인다", listC.length, 2);
check("새 글이 맨 앞에 온다", listC[0].label, "다른 글");
check("id 로 찾는다", history.find(listC, e1.id).label, "고친 제목");
check("없는 id 는 null", history.find(listC, "nope"), null);
check("id 로 지운다", history.remove(listC, e1.id).length, 1);

// 상한을 넘기면 오래된 것부터 버린다.
let big = [];
for (let i = 0; i < history.MAX_ITEMS + 10; i++) big = history.upsert(big, history.makeEntry({ title: `글${i}` }));
check("상한을 넘지 않는다", big.length, history.MAX_ITEMS);
check("최근 글이 남는다", big[0].label, `글${history.MAX_ITEMS + 9}`);

check("빈 글은 보관하지 않는다", history.worthSaving({ title: "", body: "" }), false);
check("태그만 있는 본문도 빈 글", history.worthSaving({ title: "", body: "<p></p>" }), false);
check("제목만 있어도 보관한다", history.worthSaving({ title: "제목", body: "" }), true);
check("본문만 있어도 보관한다", history.worthSaving({ title: "", body: "<p>글</p>" }), true);

check("깨진 저장값은 빈 목록", history.sanitize("아님").length, 0);
check("id 없는 항목은 버린다", history.sanitize([{ title: "x" }]).length, 0);
check("정상 항목은 살린다", history.sanitize([{ id: "a", title: "x", body: "<p>글</p>" }]).length, 1);
check("빠진 글자 수는 다시 센다", history.sanitize([{ id: "a", body: "<p>가나다</p>" }])[0].chars, 3);

// 저장소를 통한 왕복
const st = fakeStore();
const r1 = history.saveEntry({ title: "보관 시험", body: "<p>본문이다</p>" }, st);
check("저장하면 항목이 돌아온다", r1.entry.label, "보관 시험");
check("저장하면 목록에 들어간다", r1.list.length, 1);
